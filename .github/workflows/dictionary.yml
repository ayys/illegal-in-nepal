# Publish the iOS app's offline dictionary (shabdakosh/app_db.py). Each
# release carries the full dictionary, which the app ships with, and an update
# from the release before, which installed apps fetch quietly and apply.
name: Release app dictionary

on:
  push:
    branches: ["master"]
    paths:
      - "shabdakosh/shabdakosh.json.gz"
      - "shabdakosh/generator.py"
      - "shabdakosh/wotd_lib.py"
      - "shabdakosh/crossword_lib.py"
      - "shabdakosh/app_db.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-dictionary
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build dictionary
        working-directory: shabdakosh
        run: |
          # Sorts by time, which is how the app tells newer from older.
          tag="dictionary-$(date -u +%Y.%m.%d.%H%M)-$(git rev-parse --short HEAD)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          make shabdakosh.json
          uv run --with aiofiles --with tqdm python -m unittest test_app_db
          uv run app_db.py full "$tag" dictionary-v2.sqlite
      - name: Build update from the last release
        working-directory: shabdakosh
        run: |
          previous=$(gh release list --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("dictionary-"))][0].tagName // ""')
          if [ -n "$previous" ] && gh release download "$previous" --pattern dictionary-v2.sqlite.gz --dir previous; then
            gunzip previous/dictionary-v2.sqlite.gz
            uv run app_db.py update previous/dictionary-v2.sqlite dictionary-v2.sqlite dictionary-v2-update.sqlite
            gzip -9 dictionary-v2-update.sqlite
          fi
          gzip -9 dictionary-v2.sqlite
          ls -l dictionary-v2*.gz
      - name: Publish release
        working-directory: shabdakosh
        run: |
          gh release create "$TAG" dictionary-v2*.sqlite.gz \
            --title "शब्दकोश $TAG" \
            --notes "Offline dictionary for the Vikramashi iOS app (schema 2), built from $GITHUB_SHA. dictionary-v2.sqlite.gz is the whole dictionary; dictionary-v2-update.sqlite.gz updates the release before this one." \
            --latest=false
