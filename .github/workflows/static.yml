# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SHABDAKOSH_TAR: /tmp/shabdakosh.tar.zst
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore blog cache
        id: blog-cache
        uses: actions/cache/restore@v4
        with:
          path: site/blog
          key: blog-v1-${{ hashFiles('org/**') }}
      - name: Restore शब्दकोश cache
        id: shabdakosh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SHABDAKOSH_TAR }}
          # Any commit that does not touch shabdakosh/ (homepage, blog, CSS, …) shares this key.
          key: shabdakosh-v2-${{ hashFiles('shabdakosh/**') }}
      - name: Unpack cached शब्दकोश
        if: steps.shabdakosh-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p site
          zstd -dc "$SHABDAKOSH_TAR" | tar -C site -xf -
          make -C shabdakosh shabdakosh.json
          # Checkout mtimes are "now"; make would rebuild unless stamps are newer.
          touch shabdakosh/build site/shabdakosh/.built
      - name: Reuse cached blog
        if: steps.blog-cache.outputs.cache-hit == 'true'
        run: touch site/blog/.built
      - name: Install Emacs
        if: steps.blog-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build site
        run: make build
      - name: Pack शब्दकोश cache
        if: success() && steps.shabdakosh-cache.outputs.cache-hit != 'true'
        run: tar -C site -cf - shabdakosh | zstd -T0 -o "$SHABDAKOSH_TAR"
      - name: Save शब्दकोश cache
        if: success() && steps.shabdakosh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SHABDAKOSH_TAR }}
          key: ${{ steps.shabdakosh-cache.outputs.cache-primary-key }}
      - name: Save blog cache
        if: success() && steps.blog-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: site/blog
          key: ${{ steps.blog-cache.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
