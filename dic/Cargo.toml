[package]
name = "dic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
cosmic-text = "0.17.0"
flate2 = "1"
form_urlencoded = "1"
png = "0.18.1"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tiny_http = "0.12"
unicode-normalization = "0.1"
ureq = "2"

[profile.release]
strip = true
