<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>आजको शब्द</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam&family=Tiro+Devanagari+Hindi&display=swap">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #fff6ee;
            color: #2c1810;
            font-family: "Tiro Devanagari Hindi", Georgia, serif;
        }
        a.banner {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            padding: 12px;
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            border: 3px solid #e07a3a;
            background: #fff6ee;
        }
        a.banner svg.art {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            width: 100%;
            height: 64%;
            display: block;
            pointer-events: none;
        }
        .copy {
            position: relative;
            z-index: 1;
            padding: 4px 4px 0;
            background: transparent;
        }
        .label {
            font-family: "Kalam", serif;
            font-size: 13px;
            color: #8a6456;
            margin: 0;
        }
        .word {
            font-family: "Kalam", serif;
            font-size: 28px;
            line-height: 1.55;
            margin: 0 0 4px;
            padding-top: 0.22em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sense {
            font-size: 13px;
            line-height: 1.35;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .fail { padding: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <a class="banner" id="link" target="_blank" rel="noopener noreferrer" href="./आजको-शब्द.html">
        <svg class="art" viewBox="0 0 200 200" fill="none" aria-hidden="true">
            <g fill="#e07a3a" fill-opacity="0.1">
                <ellipse cx="28" cy="36" rx="9" ry="7"/>
                <circle cx="18" cy="24" r="4.2"/>
                <circle cx="28" cy="20" r="4.2"/>
                <circle cx="38" cy="24" r="4.2"/>
                <ellipse cx="176" cy="32" rx="8" ry="6"/>
                <circle cx="168" cy="22" r="3.4"/>
                <circle cx="176" cy="18" r="3.4"/>
                <circle cx="184" cy="22" r="3.4"/>
            </g>
            <g transform="translate(62 10)">
                <path d="M16 118c0-28 8-52 22-52s22 24 22 52" fill="#f7f3ea" stroke="#4d89c8" stroke-width="3"/>
                <circle cx="38" cy="38" r="22" fill="#f7f3ea" stroke="#4d89c8" stroke-width="3"/>
                <path d="M20 24l-6-20 16 12zM54 22l8-20-16 13z" fill="#f7f3ea" stroke="#4d89c8" stroke-width="2.4"/>
                <circle cx="30" cy="36" r="2.1" fill="#2c1810"/>
                <circle cx="44" cy="36" r="2.1" fill="#2c1810"/>
                <path d="M37 42v5" stroke="#e07a3a" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M32 50c3.2 3 8 3 11.2 0" stroke="#2c1810" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M18 40h-12M18 46h-10M58 40h12M58 46h10" stroke="#4d89c8" stroke-width="1.4" stroke-linecap="round"/>
                <path d="M62 92c16 6 20 22 10 32" stroke="#4d89c8" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="28" cy="118" rx="9" ry="4" fill="#4d89c8"/>
                <ellipse cx="48" cy="118" rx="9" ry="4" fill="#4d89c8"/>
            </g>
            <g transform="translate(128 96) rotate(-8)">
                <rect x="0" y="0" width="36" height="26" rx="2" fill="#e07a3a" stroke="#2c1810" stroke-width="2"/>
                <path d="M18 2v22" stroke="#2c1810" stroke-width="1.4"/>
                <rect x="4" y="4" width="12" height="18" fill="#fff6ee"/>
                <rect x="20" y="4" width="12" height="18" fill="#fff6ee"/>
                <path d="M6 8h8M6 12h8M22 8h8M22 12h8" stroke="#edc8a8" stroke-width="1"/>
            </g>
        </svg>
        <div class="copy">
            <p class="label">आजको शब्द · अवैध अन्तर्जाले कोठा</p>
            <p class="word" id="word">…</p>
            <p class="sense" id="sense"></p>
        </div>
    </a>
    <script src="./wotd.js"></script>
    <script>
        (async () => {
            try {
                const picked = await Wotd.today("./");
                document.getElementById("word").textContent = picked.word;
                document.getElementById("sense").textContent = picked.sense;
                document.getElementById("link").href =
                    location.origin + "/shabdakosh/" +
                    encodeURIComponent(picked.slug) + ".html";
            } catch (err) {
                document.getElementById("word").textContent = "…";
                document.getElementById("sense").textContent =
                    "आजको शब्द लोड गर्न सकिएन।";
                console.error(err);
            }
        })();
    </script>
</body>
</html>
