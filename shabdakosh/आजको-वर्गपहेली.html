<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>आजको वर्गपहेली</title>
    <meta name="description" content="शब्दकोशका शब्दबाट हरेक दिन आफैं बन्ने सानो नेपाली वर्गपहेली।">
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/common.css">
    <style>
        .kosh-nav { margin-bottom: 1rem; }
        .cw-date, .cw-status, .cw-rules { color: var(--mute); }
        .cw-score { font-size: 1.2rem; margin: 0; }
        .cw-board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            width: min(100%, 26rem);
            margin: 1rem 0;
            padding: 3px;
            background: var(--ink);
            border-radius: 0.5rem;
        }
        .cw-cell {
            position: relative;
            aspect-ratio: 1;
            background: #fff;
            border-radius: 0.2rem;
        }
        .cw-cell.block { background: var(--ink); }
        .cw-cell.in-word { background: var(--chip); }
        .cw-cell.current { background: #ffd7a8; }
        .cw-cell.wrong input { color: var(--link); text-decoration: line-through; }
        .cw-cell.right input { color: #2f6b2f; }
        .cw-num {
            position: absolute;
            top: 1px;
            left: 3px;
            font-size: 0.65rem;
            line-height: 1;
            color: var(--mute);
            pointer-events: none;
        }
        .cw-cell input {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 0;
            padding: 0;
            background: transparent;
            text-align: center;
            font: inherit;
            font-size: clamp(1rem, 4.5vw, 1.45rem);
            color: var(--ink);
            caret-color: var(--ginger);
            outline: none;
        }
        .cw-actions button {
            font: inherit;
            margin: 0 0.4rem 0.4rem 0;
            padding: 0.25rem 0.9rem;
            background: var(--chip);
            color: var(--ink);
            border: 2px solid var(--rule);
            border-radius: 0.6rem;
            cursor: pointer;
        }
        .cw-actions button:hover { border-color: var(--ginger); }
        .cw-clues {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1.5rem;
        }
        .cw-clues ol { list-style: none; padding: 0; margin: 0; }
        .cw-clues li {
            padding: 0.15rem 0.4rem;
            border-radius: 0.4rem;
            cursor: pointer;
        }
        .cw-clues li.active { background: var(--chip); }
        .cw-clues li b { margin-right: 0.35rem; }
        .cw-mark { margin-left: 0.35rem; white-space: nowrap; }
        .cw-mark.right { color: #2f6b2f; }
        .cw-mark.wrong { color: var(--link); }
        @media (max-width: 600px) {
            .cw-clues { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <p class="kosh-nav"><a href="/">गृह</a> · <a href="/shabdakosh/">शब्दकोश</a> · <a href="./आजको-शब्द.html">आजको शब्द</a></p>
    <p class="heading">आजको वर्गपहेली</p>
    <p id="date" class="cw-date"></p>
    <p id="status" class="cw-status">पहेली बनाइँदैछ…</p>
    <div id="game" hidden>
        <p id="score" class="cw-score"></p>
        <div id="board" class="cw-board" role="grid" aria-label="वर्गपहेली"></div>
        <p class="cw-actions">
            <button type="button" id="check">जाँच</button>
            <button type="button" id="fill">शब्द भर</button>
            <button type="button" id="reveal">उत्तर</button>
            <button type="button" id="clear">मेटाउ</button>
        </p>
        <section class="cw-clues">
            <div>
                <h2>तेर्सो</h2>
                <ol id="clues-across"></ol>
            </div>
            <div>
                <h2>ठाडो</h2>
                <ol id="clues-down"></ol>
            </div>
        </section>
        <p class="cw-rules">हरेक कोठामा एउटा अक्षर (मात्रासहित) लेख्नुहोस्। पूरा अङ्क (हरेक शब्दको १०) बाट सुरु हुन्छ; हरेक गलत अनुमानको −२, “शब्द भर” वा “उत्तर” ले भरेको हरेक शब्दको −१०। पहेली हरेक दिन आफैं बदलिन्छ।</p>
    </div>
    <noscript>
        <p>वर्गपहेली खेल्न JavaScript चाहिन्छ।</p>
    </noscript>
    <script src="./wotd.js"></script>
    <script src="./crossword.js"></script>
    <script>
        (async () => {
            const MARK = /^[\u093e-\u094c\u0901-\u0903]/;
            const AKSHAR = /(?:[\u0905-\u0914]|[\u0915-\u0939][\u093e-\u094c]?)[\u0901-\u0903]?/g;
            const $ = (id) => document.getElementById(id);
            const status = $("status");
            const day = Wotd.nepalDay();
            $("date").textContent = day;

            let puzzle;
            try {
                puzzle = await Crossword.forDay(await Wotd.loadJson("./crossword.json.gz"), day);
            } catch (err) {
                console.error(err);
                status.textContent = "आजको वर्गपहेली लोड गर्न सकिएन।";
                return;
            }

            const { size, grid, words } = puzzle;
            const storeKey = "vargapaheli:" + day;
            const inputs = grid.map((row) => row.map(() => null));
            const cellEls = grid.map((row) => row.map(() => null));
            const owners = grid.map((row) => row.map(() => ({})));
            const clueEls = [];
            const marks = [];
            let filled = new Set();
            let misses = new Set();
            let active = 0;

            const cellsOf = (w) => w.cells.map((_, i) =>
                w.dir === "across" ? [w.row, w.col + i] : [w.row + i, w.col]);
            const entryOf = (wi) => cellsOf(words[wi]).map(([r, c]) => inputs[r][c].value);
            const isRight = (wi) => entryOf(wi).join("") === words[wi].word;
            words.forEach((w, wi) => cellsOf(w).forEach(([r, c]) => { owners[r][c][w.dir] = wi; }));

            const board = $("board");
            const startNumber = new Map(words.map((w) => [w.row * size + w.col, w.number]));
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cw-cell";
                    cellEls[r][c] = cell;
                    if (!grid[r][c]) {
                        cell.classList.add("block");
                    } else {
                        const n = startNumber.get(r * size + c);
                        if (n) {
                            const num = document.createElement("span");
                            num.className = "cw-num";
                            num.textContent = n;
                            cell.appendChild(num);
                        }
                        const input = document.createElement("input");
                        input.lang = "ne";
                        input.autocomplete = "off";
                        input.spellcheck = false;
                        input.setAttribute("autocapitalize", "off");
                        input.setAttribute("aria-label", `${r + 1}, ${c + 1}`);
                        input.dataset.r = r;
                        input.dataset.c = c;
                        inputs[r][c] = input;
                        cell.appendChild(input);
                    }
                    board.appendChild(cell);
                }
            }

            for (const dir of ["across", "down"]) {
                words.forEach((w, wi) => {
                    if (w.dir !== dir) return;
                    const li = document.createElement("li");
                    const b = document.createElement("b");
                    b.textContent = w.number;
                    marks[wi] = document.createElement("span");
                    li.append(b, `${w.clue} (${w.cells.length})`, marks[wi]);
                    li.addEventListener("click", (e) => {
                        if (!e.target.closest("a")) goToWord(wi);
                    });
                    clueEls[wi] = li;
                    $("clues-" + dir).appendChild(li);
                });
            }

            const save = () => {
                try {
                    localStorage.setItem(storeKey, JSON.stringify({
                        cells: inputs.map((row) => row.map((i) => (i ? i.value : ""))),
                        filled: [...filled],
                        misses: [...misses],
                        active,
                    }));
                } catch (_) {}
            };

            const render = () => {
                words.forEach((w, wi) => {
                    const mark = marks[wi];
                    mark.replaceChildren();
                    mark.className = "cw-mark";
                    if (entryOf(wi).some((v) => !v)) return;
                    if (!isRight(wi)) {
                        mark.classList.add("wrong");
                        mark.textContent = "✗";
                        return;
                    }
                    mark.classList.add("right");
                    const a = document.createElement("a");
                    a.href = "./" + encodeURIComponent(Wotd.slugify(w.word)) + ".html";
                    a.textContent = w.word;
                    mark.append("✓ ", a);
                });
                const points = Crossword.score(words, filled.size, misses.size);
                $("score").textContent = `अङ्क: ${points.toLocaleString("ne")} / ${Crossword.maxScore(words).toLocaleString("ne")}`;
                status.textContent = words.every((_, wi) => isRight(wi)) ? "बधाई छ! पहेली पूरा भयो।" : "";
            };

            const changed = () => {
                words.forEach((_, wi) => {
                    const entry = entryOf(wi);
                    if (!filled.has(wi) && entry.every(Boolean) && !isRight(wi)) misses.add(`${wi}:${entry.join("")}`);
                });
                save();
                render();
            };

            const fillWord = (wi) => {
                if (isRight(wi)) return;
                cellsOf(words[wi]).forEach(([r, c], i) => {
                    inputs[r][c].value = words[wi].cells[i];
                    cellEls[r][c].classList.remove("wrong", "right");
                });
                filled.add(wi);
            };

            try {
                let saved = JSON.parse(localStorage.getItem(storeKey) || "null");
                if (Array.isArray(saved)) saved = { cells: saved };
                if (saved && saved.cells) {
                    saved.cells.forEach((row, r) => row.forEach((v, c) => { if (inputs[r] && inputs[r][c]) inputs[r][c].value = v; }));
                    filled = new Set(saved.filled || []);
                    misses = new Set(saved.misses || []);
                    if (words[saved.active]) active = saved.active;
                }
            } catch (_) {}

            const highlight = (r0, c0) => {
                for (const row of cellEls) for (const el of row) el.classList.remove("in-word", "current");
                clueEls.forEach((li) => li.classList.remove("active"));
                cellsOf(words[active]).forEach(([r, c]) => cellEls[r][c].classList.add("in-word"));
                if (r0 !== undefined) cellEls[r0][c0].classList.add("current");
                clueEls[active].classList.add("active");
                save();
            };

            const focusCell = (r, c) => {
                if (inputs[r] && inputs[r][c]) inputs[r][c].focus();
            };

            const firstEmpty = (wi) => cellsOf(words[wi]).find(([r, c]) => !inputs[r][c].value);
            const goToWord = (wi) => {
                active = wi;
                const [r, c] = firstEmpty(wi) || cellsOf(words[wi])[0];
                focusCell(r, c);
                highlight(r, c);
            };
            // Clues in the order they're listed: across, then down.
            const clueOrder = ["across", "down"].flatMap((dir) =>
                words.map((w, wi) => [w, wi]).filter(([w]) => w.dir === dir).map(([, wi]) => wi));
            // The next clue in `step` direction that still has an empty cell,
            // or simply the next clue once the grid is full.
            const nextWord = (step) => {
                const at = clueOrder.indexOf(active), n = clueOrder.length;
                const ahead = Array.from({ length: n - 1 }, (_, k) => clueOrder[(at + step * (k + 1) + n * n) % n]);
                return ahead.find(firstEmpty) ?? ahead[0] ?? active;
            };
            const clearCell = (r, c) => {
                inputs[r][c].value = "";
                kept.set(inputs[r][c], "");
                cellEls[r][c].classList.remove("wrong", "right");
                typed = null;
                changed();
            };

            const positionIn = (wi, r, c) => cellsOf(words[wi]).findIndex(([rr, cc]) => rr === r && cc === c);

            let lastFocus = null;
            board.addEventListener("mousedown", (e) => {
                const input = e.target.closest("input");
                if (!input || lastFocus !== input) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                const other = words[active].dir === "across" ? "down" : "across";
                if (owners[r][c][other] !== undefined) {
                    active = owners[r][c][other];
                    highlight(r, c);
                }
            });

            board.addEventListener("focusin", (e) => {
                const input = e.target.closest("input");
                if (!input) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                if (positionIn(active, r, c) < 0) {
                    const keep = words[active].dir;
                    active = owners[r][c][keep] ?? owners[r][c][keep === "across" ? "down" : "across"];
                }
                lastFocus = input;
                kept.set(input, input.value);
                highlight(r, c);
                requestAnimationFrame(() => input.select());
            });

            // The cell last typed into and where the cursor went from there: a
            // vowel sign typed there joins the former, even past filled cells.
            let typed = null;
            // A cell's letter before the latest keystroke replaced its selection.
            const kept = new WeakMap();
            const emptyAfter = (path, i) => {
                const order = [...path.slice(i + 1), ...path.slice(0, i + 1)];
                return order.find(([r, c]) => !inputs[r][c].value);
            };

            board.addEventListener("input", (e) => {
                const input = e.target;
                if (e.isComposing) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                const path = cellsOf(words[active]);
                const idx = positionIn(active, r, c);
                const value = input.value.normalize("NFC").replace(/\s+/g, "");
                cellEls[r][c].classList.remove("wrong", "right");

                const resumed = typed && typed.to !== typed.from && typed.to[0] === r && typed.to[1] === c;
                const before = resumed ? typed.from : idx > 0 && path[idx - 1];
                if (MARK.test(value) && before) {
                    const [pr, pc] = before;
                    const prev = inputs[pr][pc];
                    const merged = (prev.value + value).normalize("NFC").match(AKSHAR);
                    if (merged) prev.value = merged[0];
                    input.value = kept.get(input) || "";
                    changed();
                    return;
                }

                const parts = value.match(AKSHAR) || [];
                input.value = parts[0] || "";
                let last = idx;
                for (let k = 1; k < parts.length && idx + k < path.length; k++) {
                    const [nr, nc] = path[idx + k];
                    inputs[nr][nc].value = parts[k];
                    last = idx + k;
                }
                kept.set(input, input.value);
                changed();
                if (parts.length) {
                    let next = emptyAfter(path, last);
                    if (!next) {
                        const wi = nextWord(1);
                        if (firstEmpty(wi)) {
                            active = wi;
                            next = firstEmpty(wi);
                        } else {
                            next = path[last];
                        }
                    }
                    typed = { from: path[last], to: next };
                    focusCell(next[0], next[1]);
                    highlight(next[0], next[1]);
                }
            });

            board.addEventListener("compositionend", (e) => {
                e.target.dispatchEvent(new InputEvent("input", { bubbles: true }));
            });

            board.addEventListener("keydown", (e) => {
                const input = e.target.closest("input");
                if (!input || e.isComposing) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
                if (moves[e.key]) {
                    e.preventDefault();
                    const [dr, dc] = moves[e.key];
                    const dir = dr ? "down" : "across";
                    // An arrow across the current direction first turns, as elsewhere.
                    if (words[active].dir !== dir && owners[r][c][dir] !== undefined) {
                        active = owners[r][c][dir];
                        highlight(r, c);
                        return;
                    }
                    let nr = r + dr, nc = c + dc;
                    while (nr >= 0 && nc >= 0 && nr < size && nc < size && !inputs[nr][nc]) { nr += dr; nc += dc; }
                    if (nr >= 0 && nc >= 0 && nr < size && nc < size) {
                        if (owners[nr][nc][dir] !== undefined) active = owners[nr][nc][dir];
                        focusCell(nr, nc);
                        highlight(nr, nc);
                    }
                } else if (e.key === "Tab") {
                    e.preventDefault();
                    goToWord(nextWord(e.shiftKey ? -1 : 1));
                } else if (e.key === "Delete") {
                    e.preventDefault();
                    clearCell(r, c);
                } else if (e.key === "Backspace") {
                    e.preventDefault();
                    if (input.value) {
                        clearCell(r, c);
                        return;
                    }
                    const idx = positionIn(active, r, c);
                    if (idx > 0) {
                        const [pr, pc] = cellsOf(words[active])[idx - 1];
                        clearCell(pr, pc);
                        focusCell(pr, pc);
                        highlight(pr, pc);
                    }
                }
            });

            $("check").addEventListener("click", () => {
                grid.forEach((row, r) => row.forEach((a, c) => {
                    if (!a || !inputs[r][c].value) return;
                    cellEls[r][c].classList.toggle("wrong", inputs[r][c].value !== a);
                    cellEls[r][c].classList.toggle("right", inputs[r][c].value === a);
                }));
            });

            $("fill").addEventListener("click", () => {
                fillWord(active);
                changed();
            });

            $("reveal").addEventListener("click", () => {
                words.forEach((_, wi) => fillWord(wi));
                changed();
            });

            $("clear").addEventListener("click", () => {
                grid.forEach((row, r) => row.forEach((a, c) => {
                    if (!a) return;
                    inputs[r][c].value = "";
                    cellEls[r][c].classList.remove("wrong", "right");
                }));
                changed();
            });

            document.getElementById("game").hidden = false;
            highlight();
            render();
        })();
    </script>
</body>
</html>
