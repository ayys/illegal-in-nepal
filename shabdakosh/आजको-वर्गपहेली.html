<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>आजको वर्गपहेली</title>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/common.css">
    <style>
        .kosh-nav { margin-bottom: 1rem; }
        .cw-date, .cw-status { color: var(--mute); }
        .cw-board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            width: min(100%, 26rem);
            margin: 1rem 0;
            padding: 3px;
            background: var(--ink);
            border-radius: 0.5rem;
        }
        .cw-cell {
            position: relative;
            aspect-ratio: 1;
            background: #fff;
            border-radius: 0.2rem;
        }
        .cw-cell.block { background: var(--ink); }
        .cw-cell.in-word { background: var(--chip); }
        .cw-cell.current { background: #ffd7a8; }
        .cw-cell.wrong input { color: var(--link); text-decoration: line-through; }
        .cw-cell.right input { color: #2f6b2f; }
        .cw-num {
            position: absolute;
            top: 1px;
            left: 3px;
            font-size: 0.65rem;
            line-height: 1;
            color: var(--mute);
            pointer-events: none;
        }
        .cw-cell input {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 0;
            padding: 0;
            background: transparent;
            text-align: center;
            font: inherit;
            font-size: clamp(1rem, 4.5vw, 1.45rem);
            color: var(--ink);
            caret-color: var(--ginger);
            outline: none;
        }
        .cw-actions button {
            font: inherit;
            margin-right: 0.4rem;
            padding: 0.25rem 0.9rem;
            background: var(--chip);
            color: var(--ink);
            border: 2px solid var(--rule);
            border-radius: 0.6rem;
            cursor: pointer;
        }
        .cw-actions button:hover { border-color: var(--ginger); }
        .cw-clues {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1.5rem;
        }
        .cw-clues ol { list-style: none; padding: 0; margin: 0; }
        .cw-clues li {
            padding: 0.15rem 0.4rem;
            border-radius: 0.4rem;
            cursor: pointer;
        }
        .cw-clues li.active { background: var(--chip); }
        .cw-clues li b { margin-right: 0.35rem; }
        .cw-clues li a { margin-left: 0.35rem; }
        .cw-hint-btn {
            font: inherit;
            font-size: 0.8rem;
            padding: 0 0.45rem;
            background: transparent;
            color: var(--link);
            border: 1px dashed var(--rule);
            border-radius: 0.5rem;
            cursor: pointer;
        }
        .cw-hint {
            display: block;
            font-size: 0.92rem;
            color: var(--mute);
        }
        @media (max-width: 600px) {
            .cw-clues { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <p class="kosh-nav"><a href="/">गृह</a> · <a href="/shabdakosh/">शब्दकोश</a> · <a href="./आजको-शब्द.html">आजको शब्द</a></p>
    <p class="heading">आजको वर्गपहेली</p>
    <p id="date" class="cw-date"></p>
    <p id="status" class="cw-status">पहेली बनाइँदैछ…</p>
    <div id="game" hidden>
        <div id="board" class="cw-board" role="grid" aria-label="वर्गपहेली"></div>
        <p class="cw-actions">
            <button type="button" id="check">जाँच</button>
            <button type="button" id="reveal">उत्तर</button>
            <button type="button" id="clear">मेटाउ</button>
        </p>
        <section class="cw-clues">
            <div>
                <h2>तेर्सो</h2>
                <ol id="clues-across"></ol>
            </div>
            <div>
                <h2>ठाडो</h2>
                <ol id="clues-down"></ol>
            </div>
        </section>
        <p>हरेक कोठामा एउटा अक्षर (मात्रासहित) लेख्नुहोस्। पहेली हरेक दिन आफैं बदलिन्छ।</p>
    </div>
    <noscript>
        <p>वर्गपहेली खेल्न JavaScript चाहिन्छ।</p>
    </noscript>
    <script src="./wotd.js"></script>
    <script src="./crossword.js"></script>
    <script>
        (async () => {
            const MARK = /^[\u093e-\u094c\u0901-\u0903]/;
            const AKSHAR = /(?:[\u0905-\u0914]|[\u0915-\u0939][\u093e-\u094c]?)[\u0901-\u0903]?/g;
            const status = document.getElementById("status");
            const day = Wotd.nepalDay();
            document.getElementById("date").textContent = day;

            let puzzle;
            try {
                puzzle = await Crossword.forDay(await Wotd.loadJson("./crossword.json.gz"), day);
            } catch (err) {
                console.error(err);
                status.textContent = "आजको वर्गपहेली लोड गर्न सकिएन।";
                return;
            }

            const { size, grid, words } = puzzle;
            const storeKey = "vargapaheli:" + day;
            const inputs = grid.map((row) => row.map(() => null));
            const cellEls = grid.map((row) => row.map(() => null));
            const owners = grid.map((row) => row.map(() => ({})));
            const clueEls = [];
            let active = 0;
            let done = false;

            const cellsOf = (w) => w.cells.map((_, i) =>
                w.dir === "across" ? [w.row, w.col + i] : [w.row + i, w.col]);
            words.forEach((w, wi) => cellsOf(w).forEach(([r, c]) => { owners[r][c][w.dir] = wi; }));

            const save = () => {
                try {
                    localStorage.setItem(storeKey, JSON.stringify(inputs.map((row) => row.map((i) => (i ? i.value : "")))));
                } catch (_) {}
            };

            const board = document.getElementById("board");
            const startNumber = new Map(words.map((w) => [w.row * size + w.col, w.number]));
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cw-cell";
                    cellEls[r][c] = cell;
                    if (!grid[r][c]) {
                        cell.classList.add("block");
                    } else {
                        const n = startNumber.get(r * size + c);
                        if (n) {
                            const num = document.createElement("span");
                            num.className = "cw-num";
                            num.textContent = n;
                            cell.appendChild(num);
                        }
                        const input = document.createElement("input");
                        input.setAttribute("lang", "ne");
                        input.setAttribute("autocomplete", "off");
                        input.setAttribute("autocapitalize", "off");
                        input.setAttribute("spellcheck", "false");
                        input.setAttribute("aria-label", `${r + 1}, ${c + 1}`);
                        input.dataset.r = r;
                        input.dataset.c = c;
                        inputs[r][c] = input;
                        cell.appendChild(input);
                    }
                    board.appendChild(cell);
                }
            }

            try {
                const saved = JSON.parse(localStorage.getItem(storeKey) || "null");
                if (saved) saved.forEach((row, r) => row.forEach((v, c) => { if (inputs[r][c]) inputs[r][c].value = v; }));
            } catch (_) {}

            const showLinks = () => {
                clueEls.forEach((li, wi) => {
                    if (li.querySelector("a")) return;
                    const a = document.createElement("a");
                    a.href = "./" + encodeURIComponent(Wotd.slugify(words[wi].word)) + ".html";
                    a.textContent = words[wi].word + " →";
                    li.appendChild(a);
                });
            };

            for (const dir of ["across", "down"]) {
                const list = document.getElementById("clues-" + dir);
                words.forEach((w, wi) => {
                    if (w.dir !== dir) return;
                    const li = document.createElement("li");
                    const b = document.createElement("b");
                    b.textContent = w.number;
                    li.append(b, `${w.clue} (${w.cells.length})`);
                    if (w.hint) {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "cw-hint-btn";
                        btn.textContent = "संकेत";
                        btn.addEventListener("click", () => {
                            const hint = document.createElement("span");
                            hint.className = "cw-hint";
                            hint.textContent = w.hint;
                            btn.replaceWith(hint);
                        });
                        li.append(" ", btn);
                    }
                    li.addEventListener("click", (e) => {
                        if (e.target.closest("a, button")) return;
                        active = wi;
                        const [r, c] = cellsOf(w).find(([r, c]) => !inputs[r][c].value) || cellsOf(w)[0];
                        inputs[r][c].focus();
                    });
                    clueEls[wi] = li;
                    list.appendChild(li);
                });
            }

            const highlight = (r0, c0) => {
                for (const row of cellEls) for (const el of row) el.classList.remove("in-word", "current");
                clueEls.forEach((li) => li.classList.remove("active"));
                cellsOf(words[active]).forEach(([r, c]) => cellEls[r][c].classList.add("in-word"));
                if (r0 !== undefined) cellEls[r0][c0].classList.add("current");
                clueEls[active].classList.add("active");
            };

            const focusCell = (r, c) => {
                if (inputs[r] && inputs[r][c]) inputs[r][c].focus();
            };

            const positionIn = (wi, r, c) => cellsOf(words[wi]).findIndex(([rr, cc]) => rr === r && cc === c);

            const finishIfSolved = () => {
                const solved = grid.every((row, r) => row.every((a, c) => !a || inputs[r][c].value === a));
                if (solved && !done) {
                    done = true;
                    status.textContent = "बधाई छ! पहेली पूरा भयो।";
                    showLinks();
                }
            };

            let lastFocus = null;
            board.addEventListener("mousedown", (e) => {
                const input = e.target.closest("input");
                if (!input) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                if (lastFocus === input) {
                    const other = words[active].dir === "across" ? "down" : "across";
                    if (owners[r][c][other] !== undefined) {
                        active = owners[r][c][other];
                        highlight(r, c);
                    }
                }
            });

            board.addEventListener("focusin", (e) => {
                const input = e.target.closest("input");
                if (!input) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                if (positionIn(active, r, c) < 0) {
                    const keep = words[active].dir;
                    active = owners[r][c][keep] ?? owners[r][c][keep === "across" ? "down" : "across"];
                }
                lastFocus = input;
                highlight(r, c);
                requestAnimationFrame(() => input.select());
            });

            board.addEventListener("input", (e) => {
                const input = e.target;
                if (e.isComposing) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                const path = cellsOf(words[active]);
                const idx = positionIn(active, r, c);
                const value = input.value.normalize("NFC").replace(/\s+/g, "");
                cellEls[r][c].classList.remove("wrong", "right");

                if (MARK.test(value) && idx > 0) {
                    const [pr, pc] = path[idx - 1];
                    const prev = inputs[pr][pc];
                    const merged = (prev.value + value).normalize("NFC").match(AKSHAR);
                    if (merged) prev.value = merged[0];
                    input.value = "";
                    save();
                    finishIfSolved();
                    return;
                }

                const parts = value.match(AKSHAR) || [];
                input.value = parts[0] || "";
                let last = idx;
                for (let k = 1; k < parts.length && idx + k < path.length; k++) {
                    const [nr, nc] = path[idx + k];
                    inputs[nr][nc].value = parts[k];
                    last = idx + k;
                }
                save();
                finishIfSolved();
                if (parts.length) {
                    const next = path[Math.min(last + 1, path.length - 1)];
                    focusCell(next[0], next[1]);
                }
            });

            board.addEventListener("compositionend", (e) => {
                e.target.dispatchEvent(new InputEvent("input", { bubbles: true }));
            });

            board.addEventListener("keydown", (e) => {
                const input = e.target.closest("input");
                if (!input) return;
                const r = +input.dataset.r, c = +input.dataset.c;
                const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
                if (moves[e.key]) {
                    e.preventDefault();
                    const [dr, dc] = moves[e.key];
                    const dir = dr ? "down" : "across";
                    let nr = r + dr, nc = c + dc;
                    while (nr >= 0 && nc >= 0 && nr < size && nc < size && !inputs[nr][nc]) { nr += dr; nc += dc; }
                    if (nr >= 0 && nc >= 0 && nr < size && nc < size) {
                        if (owners[nr][nc][dir] !== undefined) active = owners[nr][nc][dir];
                        focusCell(nr, nc);
                    }
                } else if (e.key === "Backspace" && !input.value) {
                    e.preventDefault();
                    const idx = positionIn(active, r, c);
                    if (idx > 0) {
                        const [pr, pc] = cellsOf(words[active])[idx - 1];
                        inputs[pr][pc].value = "";
                        save();
                        focusCell(pr, pc);
                    }
                }
            });

            document.getElementById("check").addEventListener("click", () => {
                grid.forEach((row, r) => row.forEach((a, c) => {
                    if (!a || !inputs[r][c].value) return;
                    cellEls[r][c].classList.toggle("wrong", inputs[r][c].value !== a);
                    cellEls[r][c].classList.toggle("right", inputs[r][c].value === a);
                }));
                finishIfSolved();
            });

            document.getElementById("reveal").addEventListener("click", () => {
                grid.forEach((row, r) => row.forEach((a, c) => {
                    if (!a) return;
                    inputs[r][c].value = a;
                    cellEls[r][c].classList.remove("wrong", "right");
                }));
                save();
                done = true;
                status.textContent = "उत्तर देखाइयो।";
                showLinks();
            });

            document.getElementById("clear").addEventListener("click", () => {
                grid.forEach((row, r) => row.forEach((a, c) => {
                    if (!a) return;
                    inputs[r][c].value = "";
                    cellEls[r][c].classList.remove("wrong", "right");
                }));
                save();
                done = false;
                status.textContent = "";
                clueEls.forEach((li) => { const a = li.querySelector("a"); if (a) a.remove(); });
            });

            status.textContent = "";
            document.getElementById("game").hidden = false;
            highlight();
            finishIfSolved();
        })();
    </script>
</body>
</html>
